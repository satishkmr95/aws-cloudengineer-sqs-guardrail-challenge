AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template For SQS GuardRail

Parameters:
  SubscriberEmail:
    Type: String
    Default: satish@example.com
    Description: Email address to subscribe to the SNS topic.
  LambdaRuntime:
    Type: String
    Default: python3.9
    Description: Runtime environment for the Lambda function.
  LambdaMemorySize:
    Type: Number
    Default: 128
    Description: Memory size (in MB) for the Lambda function.
  LambdaTimeout:
    Type: Number
    Default: 10
    Description: Timeout (in seconds) for the Lambda function.
  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket name where the Lambda function code is stored.
  LambdaCodeS3Key:
    Type: String
    Description: S3 object key for the Lambda function code (ZIP file).
  OrganizationalUnitId:
    Type: String
    Description: org Unit ID 
  ManagementAccountId:
    Type: String
    Description: Management account ID 
  AWSRegion:
    Type: String
    Description: AWS Region
  OrganizationId:
    Type: String
    Description: org ID

Resources:
  # SNS Topic
  ComplianceSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SQSComplianceAlertsTopic
      DisplayName: SQS Compliance Alerts

  # SNS Subscription
  ComplianceSNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref SubscriberEmail
      TopicArn: !Ref ComplianceSNSTopic

  # Permission Boundary Policy
  PermissionBoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Allow specific services used by the Lambda function
          - Effect: Allow
            Action:
              - ec2:DescribeVpcEndpoints
              - sqs:GetQueueAttributes
              - sqs:ListQueueTags
              - kms:DescribeKey
              - kms:ListAliases
              - sns:Publish
              - kms:Decrypt
            Resource: '*'

  # IAM Role for Lambda Function
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      PermissionsBoundary: !Ref PermissionBoundaryPolicy
      Policies:
        - PolicyName: LambdaSQSCompliancePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                  - sqs:ListQueueTags
                  - sqs:CreateQueue
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:DescribeVpcEndpoints
                Resource: '*'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: '*'                
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ComplianceSNSTopic
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda Function
  SQSComplianceLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Runtime: !Ref LambdaRuntime
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref ComplianceSNSTopic

  # EventBridge Rule
  EventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.sqs
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - sqs.amazonaws.com
          eventName:
            - CreateQueue
      Targets:
        - Id: SQSComplianceLambdaTarget
          Arn: !GetAtt SQSComplianceLambda.Arn

  # Lambda Permission for EventBridge
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !GetAtt SQSComplianceLambda.Arn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventBridgeRule.Arn



  # Control Tower Guardrail
  ControlTowerGuardrail:
    Type: AWS::ControlTower::EnabledControl
    Properties:
      ControlIdentifier: "arn:aws:controlcatalog:::control/bv0kk64dmkuv1vfbiwbj3vcrw"
      #ControlIdentifier:  "arn:aws:controltower:us-east-1::control/CT.SQS.PR.1"
      TargetIdentifier: !Sub "arn:${AWS::Partition}:organizations::${ManagementAccountId}:ou/${OrganizationId}/${OrganizationalUnitId}"
      #TargetIdentifier: !Sub "arn:aws:organizations::${ManagementAccountId}:ou/o-rjak1nn0gr/${OrganizationalUnitId}"


Outputs:
  SNSTopicArn:
    Description: ARN of the SNS topic
    Value: !Ref ComplianceSNSTopic  
  LambdaFunctionArn:
    Description: ARN of the Lambda function.
    Value: !GetAtt SQSComplianceLambda.Arn
  IAMRoleArn:
    Description: ARN of the IAM role for the Lambda function.
    Value: !GetAtt LambdaExecutionRole.Arn
  EventBridgeRuleArn:
    Description: ARN of the EventBridge rule.
    Value: !GetAtt EventBridgeRule.Arn
  PermissionBoundaryArn:
    Description: ARN of the permission boundary policy.
    Value: !Ref PermissionBoundaryPolicy